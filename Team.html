<head>

<body class="subpage">
<div id="root"></div>
<script src="roster.js"></script>
<script src="media.js"></script>
<script type="text/babel" src="Hooks.jsx"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="HeroMedia.jsx"></script>
<script type="text/babel" src="Cards.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function LabelTagLocal({ children }) {
  return (
    <div style={{display:'inline-flex',alignItems:'center',gap:6,fontFamily:'Inter',fontSize:'10px',fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--muted)',marginBottom:16}}>
      <span style={{width:16,height:1,background:'var(--border-mid)',display:'inline-block'}}/>{children}<span style={{width:16,height:1,background:'var(--border-mid)',display:'inline-block'}}/>
    </div>
  );
}

function App() {
  window.useReveal();
  const roster = window.ROSTER || [];
  const studentCount = roster.filter(member => member.dept !== 'Mentor').length;
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => { const fn=()=>setScrolled(window.scrollY>40); window.addEventListener('scroll',fn); return()=>window.removeEventListener('scroll',fn); }, []);

  return (
    <div style={{minHeight:'100vh',background:'var(--bg)'}}>

      <Nav active="Team"/>

      <header className="subpage-hero">
        <HeroMedia slot="HERO_TEAM" accent="red"/>
        <div aria-hidden="true" className="subpage-etch">641</div>
        <div className="subpage-hero-inner">
          <div className="subpage-kicker"><b>03</b> The people</div>
          <h1 className="subpage-title">Meet the<br/><span className="accent">builders.</span></h1>
          <p className="subpage-deck">{studentCount} students, one mentor, and one shared machine. Every role matters—from machinist to programmer to strategist.</p>
          <div className="team-hero-status" aria-label="Team roster details">
            <span><b>Roster</b> 2026 season</span>
            <span><b>Team</b> FTC 641</span>
            <span><b>Base</b> Boca Raton, FL</span>
          </div>
        </div>
      </header>

      <section className="team-roster-section">
        <div className="team-roster-shell">
          <div className="team-roster-intro reveal">
            <div className="team-roster-main">
              <div className="editorial-section-label"><b>01</b> Active roster</div>
              <h2><span>{studentCount}</span> builders.<br/>One standard.</h2>
              <div className="team-roster-brief">
                <span>Built across disciplines</span>
                <p>Engineering, code, strategy, and outreach converge into one competition team. Select a member to explore their role.</p>
              </div>
            </div>
            <div className="team-roster-aside">
              <a className="team-roster-join" href={`mailto:${window.CONTACT_EMAIL}`}>
                <span className="team-roster-join-head">
                  <small>Join the build</small>
                  <i>Open call / 2026</i>
                </span>
                <span className="team-roster-join-copy">
                  <strong>Want your name on the roster?</strong>
                  <em>No experience required—just curiosity and the willingness to build.</em>
                </span>
                <span className="team-roster-join-action">
                  <span>Ask about joining</span>
                  <b aria-hidden="true">↗</b>
                </span>
              </a>
            </div>
          </div>
          <RosterGrid/>
        </div>
      </section>

      <Footer compact/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
