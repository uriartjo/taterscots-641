<body class="subpage">
<div id="root"></div>
<script src="roster.js"></script>
<script src="media.js"></script>
<script type="text/babel" src="Hooks.jsx"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="HeroMedia.jsx"></script>
<script type="text/babel" src="Cards.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function LabelTagLocal({ children }) {
  return (
    <div style={{display:'inline-flex',alignItems:'center',gap:6,fontFamily:'Inter',fontSize:'10px',fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--muted)',marginBottom:16}}>
      <span style={{width:16,height:1,background:'var(--border-mid)',display:'inline-block'}}/>{children}<span style={{width:16,height:1,background:'var(--border-mid)',display:'inline-block'}}/>
    </div>
  );
}

function JoinCTA() {
  return (
    <div className="reveal" style={{maxWidth:'var(--max-width)',margin:'0 auto 96px',padding:'0 32px'}}>
      <div style={{background:'linear-gradient(120deg,rgba(217,43,43,.14),rgba(255,197,61,.035))',border:'1px solid rgba(217,43,43,.3)',borderRadius:20,padding:'46px 48px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:24,flexWrap:'wrap',position:'relative',overflow:'hidden'}}>
        <div>
          <div className="editorial-section-label"><b>Next</b> Join the build</div>
          <div style={{fontFamily:'Inter',fontSize:'clamp(1.55rem,3vw,2.35rem)',fontWeight:800,color:'var(--white)',marginBottom:8,letterSpacing:'-.035em'}}>Want your name on this roster?</div>
          <div style={{fontSize:'0.9rem',color:'var(--muted)',lineHeight:1.7}}>We're always looking for CAD, code, fabrication, and outreach help — no experience required.</div>
        </div>
        <a href={`mailto:${window.CONTACT_EMAIL}`} style={{fontFamily:'Inter',fontSize:'0.92rem',fontWeight:600,whiteSpace:'nowrap',padding:'13px 26px',borderRadius:11,border:'1px solid var(--red)',background:'var(--red)',color:'#fff',cursor:'pointer',display:'inline-flex',alignItems:'center',gap:9,textDecoration:'none',transition:'transform 0.2s,background 0.2s'}}
          onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.background='var(--red-bright)'}} onMouseLeave={e=>{e.currentTarget.style.transform='';e.currentTarget.style.background='var(--red)'}}>
          Ask about joining
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>
    </div>
  );
}

function App() {
  window.useReveal();
  const roster = window.ROSTER || [];
  const studentCount = roster.filter(member => member.dept !== 'Mentor').length;
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => { const fn=()=>setScrolled(window.scrollY>40); window.addEventListener('scroll',fn); return()=>window.removeEventListener('scroll',fn); }, []);

  return (
    <div style={{minHeight:'100vh',background:'var(--bg)'}}>

      <Nav active="Team"/>

      <header className="subpage-hero">
        <HeroMedia slot="HERO_TEAM" accent="red"/>
        <div aria-hidden="true" className="subpage-etch">TEAM</div>
        <div className="subpage-hero-inner">
          <div className="subpage-kicker"><b>03</b> The people</div>
          <h1 className="subpage-title">Meet the<br/><span className="accent">builders.</span></h1>
          <p className="subpage-deck">{studentCount} students, one mentor, and one shared machine. Every role matters—from machinist to programmer to strategist.</p>
        </div>
      </header>

      <section style={{padding:'64px 0 96px',position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',inset:0,pointerEvents:'none',background:'radial-gradient(ellipse 28% 100% at 0% 50%, rgba(217,43,43,0.07) 0%, transparent 100%), radial-gradient(ellipse 28% 100% at 100% 50%, rgba(255,197,61,0.045) 0%, transparent 100%)'}}/>
        <div style={{maxWidth:'var(--max-width)',margin:'0 auto',padding:'0 32px',position:'relative',zIndex:1}}>
          <RosterGrid/>
        </div>
      </section>

      <JoinCTA/>
      <Footer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
