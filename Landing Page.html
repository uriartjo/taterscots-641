<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Calendar (Google Calendar via ICS proxy) ── */
const ICAL_URL = 'https://raspy-fog-fe7a.vespar.workers.dev/';
const CALENDAR_SUBSCRIBE_URL = 'https://calendar.google.com/calendar/u/0?cid=Y183YTljNGFlYjU0ZDcyZmM5ZmM5YmRiODc1YzlmZWMzMmExOWNmNjY1YTEwMWVlNzYzYWRhMDMyNTZlZGY2ODY1QGdyb3VwLmNhbGVuZGFyLmdvb2dsZS5jb20';
function parseICalDate(line) {
  const parts = line.split(':');
  const value = parts[parts.length - 1].trim();
  const isAllDay = line.includes('VALUE=DATE') || !value.includes('T');
  const year = parseInt(value.substr(0, 4)), month = parseInt(value.substr(4, 2)) - 1, day = parseInt(value.substr(6, 2));
  let date;
  if (isAllDay) { date = new Date(year, month, day); }
  else {
    const hour = parseInt(value.substr(9, 2)), minute = parseInt(value.substr(11, 2)), second = parseInt(value.substr(13, 2)) || 0;
    date = value.endsWith('Z') ? new Date(Date.UTC(year, month, day, hour, minute, second)) : new Date(year, month, day, hour, minute, second);
  }
  return { date, isAllDay };
}
function unescapeICSText(s) { return s.replace(/\\n/gi, ' ').replace(/\\([,;\\])/g, '$1').trim(); }
function getICSValue(line) { return line.slice(line.indexOf(':') + 1); }
function unfoldICS(icsText) {
  const raw = icsText.split(/\r?\n/); const lines = [];
  for (const l of raw) { if ((l.startsWith(' ') || l.startsWith('\t')) && lines.length > 0) lines[lines.length - 1] += l.slice(1); else lines.push(l); }
  return lines;
}
function parseICS(icsText) {
  const events = []; const lines = unfoldICS(icsText); let cur = null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  for (let raw of lines) {
    const line = raw.trim();
    if (line.startsWith('BEGIN:VEVENT')) { cur = {}; }
    else if (line.startsWith('END:VEVENT')) { if (cur && cur.startDate && cur.startDate >= today && cur.status !== 'CANCELLED') events.push(cur); cur = null; }
    else if (cur) {
      if (line.startsWith('SUMMARY')) cur.summary = unescapeICSText(getICSValue(line));
      else if (line.startsWith('DTSTART')) { const r = parseICalDate(line); cur.startDate = r.date; cur.isAllDay = r.isAllDay; }
      else if (line.startsWith('LOCATION')) cur.location = unescapeICSText(getICSValue(line));
      else if (line.startsWith('STATUS')) cur.status = getICSValue(line).toUpperCase();
    }
  }
  return events.sort((a, b) => a.startDate - b.startDate);
}
function getEventIcon(summary) {
  const title = (summary || '').toLowerCase();
  if (title.includes('tournament') || title.includes('competition')) return 'trophy';
  if (title.includes('practice') || title.includes('build') || title.includes('weekday')) return 'people';
  if (title.includes('weekend') || title.includes('meeting') || title.includes('meet')) return 'calendar';
  return 'flag';
}
function getEventTypeLabel(type) {
  return {people:'Team practice', calendar:'Team meeting', trophy:'Competition', flag:'Team event'}[type] || 'Team event';
}
function formatEventTime(event) {
  if (event.isAllDay) return 'All day';
  return event.startDate.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
}
const EVENT_ICON_PATHS = {
  people: [{tag:'circle',cx:'12',cy:'7',r:'4'},{tag:'path',d:'M5.5 21a6.5 6.5 0 0113 0'}],
  calendar: [{tag:'rect',x:'3',y:'4',width:'18',height:'18',rx:'2'},{tag:'path',d:'M16 2v4M8 2v4M3 10h18'}],
  trophy: [{tag:'path',d:'M8 21h8M12 17v4M7 4h10v4a5 5 0 01-10 0V4zM7 4H4a1 1 0 00-1 1v1a4 4 0 004 4M17 4h3a1 1 0 011 1v1a4 4 0 01-4 4'}],
  flag: [{tag:'path',d:'M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z'},{tag:'path',d:'M4 22V15'}],
};
const EVENT_TYPE_COLOR = {
  people:   { solid:'var(--green)',  dim:'var(--green-dim)',  border:'rgba(52,164,108,0.28)' },
  calendar: { solid:'var(--blue)',   dim:'var(--blue-dim)',   border:'rgba(77,159,255,0.28)' },
  trophy:   { solid:'var(--amber)',  dim:'var(--amber-dim)',  border:'rgba(255,197,61,0.28)' },
  flag:     { solid:'var(--red-bright)', dim:'var(--red-dim)',border:'rgba(217,43,43,0.28)' },
};
function renderEventIcon(type) {
  const parts = EVENT_ICON_PATHS[type] || EVENT_ICON_PATHS.flag;
  return <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {parts.map((el,i) => { const {tag,...attrs} = el; return React.createElement(tag, {key:i, ...attrs}); })}
  </svg>;
}
function useUpcomingEvents() {
  const [events, setEvents] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(false);
  useEffect(() => {
    fetch(ICAL_URL).then(r => { if (!r.ok) throw new Error('calendar fetch failed'); return r.text(); })
      .then(text => setEvents(parseICS(text))).catch(() => { setEvents([]); setError(true); }).finally(() => setLoading(false));
  }, []);
  return { events, loading, error };
}

}

          </div>

}

    { title:'Programming', desc:'Java control systems, autonomous routines, and vision that performs under pressure.', href:'Guides.html', media:window.MEDIA.DISCIPLINE_PROGRAMMING },

    { title:'Outreach', desc:'Sharing STEM with 200+ students and building a stronger robotics community.', href:'About.html', media:window.MEDIA.DISCIPLINE_OUTREACH },

}

function Season() {
  const { events, loading, error } = useUpcomingEvents();
  return (
    <section id="season" className="section-pad season-band">
      <div className="home-shell season-grid">
        <div className="season-copy reveal">
          <div className="section-label"><b>02</b> Team calendar</div>
          <h2>Know what's next.</h2>
          <p>Practices, team meetings, competitions, and outreach—our live schedule keeps students, families, and supporters on the same page.</p>
          <div className="team-calendar" aria-label="TaterScots 641 team calendar">
            <div className="calendar-head">
              <div className="calendar-identity">
                <span className="calendar-icon" aria-hidden="true">{renderEventIcon('calendar')}</span>
                <div><span className="calendar-kicker">TaterScots 641</span><h3>Team calendar</h3></div>
              </div>
              <span className="calendar-live"><i/>Live schedule</span>
            </div>
            <p className="calendar-intro">The next four dates from the official TaterScots calendar.</p>
            <div className="event-stack" aria-live="polite">
              {loading ? <div className="calendar-state">Loading the team calendar…</div>
                : events.length ? events.slice(0,4).map((event,i) => {
                    const type = getEventIcon(event.summary);
                    const color = EVENT_TYPE_COLOR[type];
                    return <div className="event-row" key={i}>
                      <div className="event-date" aria-label={event.startDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}>
                        <span>{event.startDate.toLocaleDateString('en-US',{weekday:'short'})}</span>
                        <strong>{event.startDate.getDate()}</strong>
                        <small>{event.startDate.toLocaleDateString('en-US',{month:'short'})}</small>
                      </div>
                      <div className="event-icon" style={{color:color.solid,background:color.dim,borderColor:color.border}} aria-hidden="true">{renderEventIcon(type)}</div>
                      <div className="event-copy">
                        <div className="event-type" style={{color:color.solid}}>{getEventTypeLabel(type)}</div>
                        <div className="event-title">{event.summary || 'Team event'}</div>
                        <div className="event-meta"><span className="event-time">{formatEventTime(event)}</span><span className="event-location">{event.location || 'Location to be announced'}</span></div>
                      </div>
                    </div>;
                  })
                : <div className="calendar-state"><strong>{error ? 'Calendar temporarily unavailable' : 'No upcoming team events'}</strong><span>{error ? 'Please check back shortly.' : 'New practices and events will appear here.'}</span></div>}
            </div>
            <div className="calendar-foot"><span>Official schedule for students, families, and supporters</span><span aria-hidden="true">FTC · 641</span></div>
          </div>
          <a className="btn-primary" href={CALENDAR_SUBSCRIBE_URL} target="_blank" rel="noreferrer" aria-label="Follow the season by subscribing to the TaterScots Google Calendar">Follow the season <span aria-hidden="true">→</span></a>
        </div>
        <div className="season-aside-column">
          <div className="season-visual reveal" data-delay="100">
            <img src={window.MEDIA.SEASON_SPREAD.src} alt="TaterScots with their robot and medals at the Florida State Championship"/>
            <div className="season-result"><strong>3×</strong><span>Florida Championship<br/>appearances</span></div>
          </div>
          <div className="season-aside-copy reveal" data-delay="160">
            <div className="section-label"><b>641</b> Between the dates</div>
            <h3>The work happens<br/><span className="accent">between events.</span></h3>
          </div>
        </div>
      </div>
    </section>
  );
}

      </div>
      <div style={{maxHeight:open?200:0,overflow:'hidden',transition:'max-height 0.3s ease'}}>

      </div>
    </div>
  );
}

        <div className="faq-wrap">
